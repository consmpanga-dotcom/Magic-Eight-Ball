<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic 8 Ball</title>
  <style>
    body {
      background: radial-gradient(circle, #111 40%, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #0ff;
      text-shadow: 0 0 10px #0ff;
    }

    .ball {
      background: radial-gradient(circle at 30% 30%, #222, #000);
      border-radius: 50%;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px;
      box-shadow: 0 0 30px #0ff88b;
    }

    .window {
      background: #111;
      border: 2px solid #0ff;
      border-radius: 10px;
      width: 130px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      text-align: center;
      font-size: 0.9rem;
    }

    input[type="text"] {
      width: 80%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
    }

    button {
      background-color: #0ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #08f;
      color: #fff;
      transform: scale(1.05);
    }

    #answer {
      color: #0ff;
      font-weight: bold;
      text-shadow: 0 0 10px #0ff;
    }
  </style>
</head>
<body>
  <h1>🎱 Magic 8 Ball</h1>
  <div class="ball">
    <div class="window">
      <p id="answer">Ask me!</p>
    </div>
  </div>

  <input type="text" id="question" placeholder="Ask a yes/no question..." />
  <button onclick="askQuestion()">Shake Ball</button>
  <button onclick="playAgain()">Play Again</button>

  <script>
    const answers = [
      "Yes, definitely!",
      "No way!",
      "Ask again later...",
      "It is certain.",
      "Don’t count on it.",
      "Outlook is good!",
      "Very doubtful.",
      "The stars say maybe..."
    ];

    function askQuestion() {
      const question = document.getElementById("question").value.trim();
      const answerDisplay = document.getElementById("answer");

      if (question === "") {
        answerDisplay.textContent = "Please ask a question!";
        return;
      }

      const randomIndex = Math.floor(Math.random() * answers.length);
      const response = answers[randomIndex];

      answerDisplay.textContent = response;
    }

    function playAgain() {
      document.getElementById("question").value = "";
      document.getElementById("answer").textContent = "Ask me!";
    }
  </script>
</body>
</html>
